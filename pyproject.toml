[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyweather"
version = "0.1.0"
description = "Polymarket weather market trading bot (paper mode, Phase 1)"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["polyweather*"]

[tool.ruff]
line-length = 100
target-version = "py311"
